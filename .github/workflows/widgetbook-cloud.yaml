name: Widgetbook Cloud
on: push

jobs:
  widgetbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8

      - name: Bootstrap App
        shell: bash
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Bootstrap Widgetbook
        working-directory: widgetbook
        shell: bash
        run: |
          flutter pub get
          flutter pub run build_runner build -d

      - name: Build Widgetbook
        working-directory: widgetbook
        shell: bash
        run: flutter build web

      - name: Generate Widgetbook snapshots
        working-directory: widgetbook
        shell: bash
        run: flutter test

      - name: Install Widgetbook CLI
        run: dart pub global activate widgetbook_cli 4.0.0-beta.14

      - name: Upload Widgetbook
        working-directory: widgetbook
        run: widgetbook cloud build push --api-key ${{ secrets.WIDGETBOOK_CLOUD_API_KEY }}
