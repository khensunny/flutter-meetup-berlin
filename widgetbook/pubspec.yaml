name: widgetbook_workspace
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ^3.38.0

dependencies:
  assets:
    path: ../assets
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  font_awesome_flutter: ^11.0.0
  groceries_app:
    path: ../
  url_launcher: ^6.3.2
  widgetbook: ^4.0.0-beta.14

dev_dependencies:
  build_runner: ^2.10.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundled so google_fonts can resolve the app's fonts offline, including
    # during `flutter test` snapshot generation.
    - assets/fonts/Lora-Medium.ttf
    - assets/fonts/Poppins-Regular.ttf
    - assets/fonts/Poppins-Medium.ttf
    - assets/fonts/Poppins-SemiBold.ttf
